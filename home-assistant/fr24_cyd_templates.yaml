# ============================================================
# Home Assistant templates for CYD Flight Tracker
# Source: sensor.flightradar24_current_in_area
# ============================================================

template:
  - sensor:
      - name: "FR24 CYD Aircraft Count"
        unique_id: fr24_cyd_aircraft_count
        icon: mdi:airplane
        state: >
          {{ states('sensor.flightradar24_current_in_area') | int(0) }}

      - name: "FR24 CYD Nearest Flight"
        unique_id: fr24_cyd_nearest_flight
        icon: mdi:airplane
        state: >
          {% set fs = state_attr('sensor.flightradar24_current_in_area', 'flights') | default([], true) | sort(attribute='distance') | list %}
          {% if fs | count > 0 %}
            {% set f = fs[0] %}
            {{ (f.flight_number | default(f.callsign, true) | default(f.aircraft_registration, true) | default('---', true))[:10] }}
          {% else %}---{% endif %}

      - name: "FR24 CYD Nearest Type"
        unique_id: fr24_cyd_nearest_type
        icon: mdi:airplane
        state: >
          {% set fs = state_attr('sensor.flightradar24_current_in_area', 'flights') | default([], true) | sort(attribute='distance') | list %}
          {% if fs | count > 0 %}
            {% set f = fs[0] %}
            {{ (f.aircraft_code | default(f.aircraft_model, true) | default('---', true))[:18] }}
          {% else %}---{% endif %}

      - name: "FR24 CYD Nearest Route"
        unique_id: fr24_cyd_nearest_route
        icon: mdi:airplane
        state: >
          {% set fs = state_attr('sensor.flightradar24_current_in_area', 'flights') | default([], true) | sort(attribute='distance') | list %}
          {% if fs | count > 0 %}
            {% set f = fs[0] %}
            {% set o = f.airport_origin_code_iata | default('---', true) %}
            {% set d = f.airport_destination_code_iata | default('---', true) %}
            {{ o }}>{{ d }}
          {% else %}---{% endif %}

      - name: "FR24 CYD Nearest Distance KM"
        unique_id: fr24_cyd_nearest_distance_km
        unit_of_measurement: "km"
        state_class: measurement
        device_class: distance
        state: >
          {% set fs = state_attr('sensor.flightradar24_current_in_area', 'flights') | default([], true) | sort(attribute='distance') | list %}
          {{ (fs[0].distance | float(0)) | round(2) if fs | count > 0 else 0 }}

      - name: "FR24 CYD Nearest Altitude FT"
