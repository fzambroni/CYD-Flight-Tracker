script:
  - id: check_internet
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${internet_check_url}
                on_response:
                  then:
                    - lambda: |-
                        id(internet_available) = response->status_code >= 200 && response->status_code < 400;
                    - script.execute: update_connectivity_page
                on_error:
                  then:
                    - lambda: 'id(internet_available) = false;'
                    - script.execute: update_connectivity_page
          else:
            - lambda: 'id(internet_available) = false;'
            - script.execute: update_connectivity_page

  - id: update_connectivity_page
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: connectivity_offline_status
          then:
            - script.execute: update_wifi_connectivity_label
            - script.execute: update_internet_connectivity_label
            - lvgl.label.update:
                id: connectivity_ha_value
                text: "UNAVAILABLE"
                text_color: 0xFF5D5D
            - lvgl.page.show:
                id: connectivity_page

  - id: update_wifi_connectivity_label
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lvgl.label.update:
                id: connectivity_wifi_value
                text: "CONNECTED"
                text_color: 0x42D392
          else:
            - lvgl.label.update:
                id: connectivity_wifi_value
                text: "OFFLINE"
                text_color: 0xFF5D5D

  - id: update_internet_connectivity_label
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: internet_status
          then:
            - lvgl.label.update:
                id: connectivity_internet_value
                text: "AVAILABLE"
                text_color: 0x42D392
          else:
            - lvgl.label.update:
                id: connectivity_internet_value
                text: "UNAVAILABLE"
                text_color: 0xFF5D5D

  - id: apply_orientation
    mode: restart
    then:
      - lvgl.display.set_rotation:
          rotation: !lambda |-
            return atoi(id(display_orientation_v2).current_option().c_str());

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
      - if:
          condition:
            switch.is_on: display_enabled
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  float value = id(display_brightness).state / 100.0f;
                  if (value < 0.01f) value = 0.01f;
                  if (value > 1.0f) value = 1.0f;
                  return value;

  - id: dim_display
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: display_enabled
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  float pct = id(dim_brightness).state;
                  if (id(night_mode).state && id(ha_time).now().is_valid()) {
                    int h = id(ha_time).now().hour;
                    int start = (int) id(night_start_hour).state;
                    int end = (int) id(night_end_hour).state;
                    bool night = start < end ? (h >= start && h < end) : (h >= start || h < end);
                    if (start == end) night = true;
                    if (night) pct = id(night_brightness).state;
                  }
                  float value = pct / 100.0f;
                  if (value < 0.01f) value = 0.01f;
                  if (value > 1.0f) value = 1.0f;
                  return value;
            - lambda: |-
                id(display_dimmed) = true;

