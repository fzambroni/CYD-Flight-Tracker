substitutions:
  device_name: "cyd-flight-tracker"
  friendly_name: "CYD Flight Tracker"
  # Compile-time endpoint used only to test general internet availability.
  internet_check_url: "http://connectivitycheck.gstatic.com/generate_204"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - script.execute: apply_orientation
      - script.execute: apply_surface_theme
      - script.execute: apply_accent_theme
      - script.execute: apply_table_font
      - script.execute: apply_visibility
      - script.execute: refresh_distance_labels
      - script.execute: refresh_nearest_metrics
      - script.execute: wake_display
      - if:
          condition:
            switch.is_on: show_splash
          then:
            - lvgl.page.show:
                id: splash_page
            - delay: !lambda |-
                uint32_t ms = (uint32_t) (id(splash_duration).state * 1000.0f);
                if (ms < 500) ms = 500;
                return ms;
      - script.execute: show_default_page
      - lambda: 'id(boot_sequence_complete) = true;'
      - script.execute: check_internet
      - script.execute: update_connectivity_page

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  id: native_api
  on_client_connected:
    - lambda: |-
        if (client_info.find("Home Assistant") != std::string::npos) {
          id(home_assistant_connected) = true;
        }
    - script.execute: update_connectivity_page
  on_client_disconnected:
    - lambda: |-
        if (client_info.find("Home Assistant") != std::string::npos) {
          id(home_assistant_connected) = false;
        }
    - script.execute: update_connectivity_page

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "CYD Flight Tracker"
    password: "cydflight123"

captive_portal:

http_request:
  id: internet_http
  timeout: 3s
  follow_redirects: false

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true

  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: mipi_spi
    id: cyd_display
    # Dual-USB CYD variant with ILI9342. This controller is natively 320x240,
    # so the LVGL base rotation must remain 0 for the landscape layout below.
    model: ESP32-2432S028-9342
    spi_id: tft_spi
    # Force the full native address window instead of relying on model metadata.
    dimensions:
      width: 320
      height: 240
      offset_width: 0
      offset_height: 0
      pad_width: 0
      pad_height: 0
    color_order: RGB
    invert_colors: false
    color_depth: 16
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
    on_touch:
      then:
        - script.execute: wake_display

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: display_dimmed
    type: bool
    restore_value: false
    initial_value: "false"

  - id: internet_available
    type: bool
    restore_value: false
    initial_value: "false"

  - id: home_assistant_connected
    type: bool
    restore_value: false
    initial_value: "false"

  - id: connectivity_page_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: boot_sequence_complete
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: template
    id: connectivity_offline_status
    internal: true
    lambda: 'return id(boot_sequence_complete) && !id(home_assistant_connected);'
    on_press:
      - lambda: 'id(connectivity_page_active) = true;'
      - script.execute: update_connectivity_page

  - platform: template
    id: connectivity_recovery_status
    internal: true
    lambda: 'return id(boot_sequence_complete) && id(home_assistant_connected) && id(connectivity_page_active);'
    on_press:
      - lambda: 'id(connectivity_page_active) = false;'
      - script.execute: show_default_page

  - platform: template
    id: internet_status
    internal: true
    lambda: 'return id(internet_available);'

number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 75
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: wake_display

  - platform: template
    name: "Splash Duration"
    id: splash_duration
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Auto Dim Timeout"
    id: auto_dim_timeout
    icon: mdi:timer-sand
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Dim Brightness"
    id: dim_brightness
    icon: mdi:brightness-5
    unit_of_measurement: "%"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Night Brightness"
    id: night_brightness
    icon: mdi:weather-night
    unit_of_measurement: "%"
    min_value: 1
    max_value: 40
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Night Start Hour"
    id: night_start_hour
    icon: mdi:clock-start
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Night End Hour"
    id: night_end_hour
    icon: mdi:clock-end
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Auto Cycle Interval"
    id: auto_cycle_interval
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Nearby Rows"
    id: nearby_rows
    icon: mdi:format-list-numbered
    min_value: 1
    max_value: 6
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: apply_visibility

select:
  - platform: template
    name: "Display Orientation"
    # The v2 ID intentionally creates a fresh preference key so devices that
    # previously stored the incorrect 90-degree value start at 0 degrees.
    id: display_orientation_v2
    icon: mdi:screen-rotation
    # The interface is landscape-only. 0 and 180 preserve its 320x240 viewport.
    options: ["0", "180"]
    initial_option: "0"
    optimistic: true
    # Only landscape-safe values are available, so the last selection can be
    # restored without reintroducing the former 90-degree viewport problem.
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: apply_orientation

  - platform: template
    name: "Default Page"
    id: default_page
    icon: mdi:view-list
    options: ["Nearby", "Nearest"]
    initial_option: "Nearby"
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Current Page"
    id: current_page
    icon: mdi:page-layout-body
    options: ["Nearby", "Nearest"]
    initial_option: "Nearby"
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - if:
          condition:
            lambda: 'return x == "Nearby";'
          then:
            - lvgl.page.show:
                id: nearby_page
      - if:
          condition:
            lambda: 'return x == "Nearest";'
          then:
            - lvgl.page.show:
                id: nearest_page

  - platform: template
    name: "Accent Theme"
    id: accent_theme
    icon: mdi:palette
    options: ["Neutral", "Blue", "Green", "Amber", "Red"]
    initial_option: "Blue"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: apply_accent_theme

  - platform: template
    name: "Surface Theme"
    id: surface_theme
    icon: mdi:theme-light-dark
    options: ["Black", "Charcoal", "Slate"]
    initial_option: "Black"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: apply_surface_theme

  - platform: template
    name: "Table Font Size"
    id: table_font_size
    icon: mdi:format-size
    options: ["Tiny", "Small", "Medium", "Large"]
    initial_option: "Small"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: apply_table_font

  - platform: template
    name: "Distance Unit"
    id: distance_unit
    icon: mdi:ruler
    options: ["Miles", "Nautical Miles", "Kilometers"]
    initial_option: "Miles"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: refresh_distance_labels

  - platform: template
    name: "Altitude Unit"
    id: altitude_unit
    icon: mdi:altimeter
    options: ["Feet", "Meters"]
    initial_option: "Feet"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: refresh_nearest_metrics

  - platform: template
    name: "Speed Unit"
    id: speed_unit
    icon: mdi:speedometer
    options: ["Knots", "MPH", "KMH"]
    initial_option: "Knots"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: refresh_nearest_metrics

switch:
