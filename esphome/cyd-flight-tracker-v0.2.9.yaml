lvgl:
  # ILI9342 native geometry is already landscape (320x240).
  rotation: 0
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  buffer_size: 25%
  default_font: montserrat_10
  page_wrap: true

  bottom_layer:
    bg_color: 0x050607
    bg_opa: COVER

  style_definitions:
    - id: row_style
      bg_color: 0x111315
      bg_opa: COVER

    - id: panel_style
      bg_color: 0x101214
      bg_opa: COVER
      border_color: 0x2A2F35
      border_width: 1
      radius: 6

    - id: muted_text_style
      text_color: 0x89929C

    - id: accent_text_style
      text_color: 0x3DA9FC

  pages:
    - id: splash_page
      bg_color: 0x050607
      scrollbar_mode: "OFF"
      scrollable: false
      widgets:
        # Tap anywhere to skip the splash screen.
        - button:
            x: 0
            y: 0
            width: 320
            height: 240
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            on_short_click:
              - script.execute: show_default_page

        - label:
            align: CENTER
            y: -18
            width: 304
            text_align: CENTER
            text: "CYD Flight Tracker"
            text_font: montserrat_28
            text_color: 0xF3F4F6

