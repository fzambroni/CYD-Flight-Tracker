      - lvgl.label.update:
          id: row_1_distance_label
          text: !lambda |-
            float km = id(row_1_distance_km).state;
            if (isnan(km)) km = 0;
            char buf[24];
            std::string unit = id(distance_unit).current_option();
            if (unit == "Nautical Miles") {
              snprintf(buf, sizeof(buf), "%.1f nm", km * 0.5399568f);
