interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(auto_dim).state || id(display_dimmed)) return false;
              uint32_t timeout_ms = (uint32_t) (id(auto_dim_timeout).state * 1000.0f);
              return millis() - id(last_touch_ms) >= timeout_ms;
          then:
            - script.execute: dim_display

      - if:
          condition:
            and:
              - switch.is_on: auto_cycle
              - lambda: 'return !id(connectivity_page_active);'
          then:
            - lambda: |-
                static uint32_t last_cycle = 0;
                uint32_t interval_ms = (uint32_t) (id(auto_cycle_interval).state * 1000.0f);
                if (interval_ms < 5000) interval_ms = 5000;
                if (millis() - last_cycle >= interval_ms) {
                  last_cycle = millis();
                  id(next_page).execute();
                }

  - interval: 2s
    then:
      - script.execute: update_connectivity_page

  - interval: 30s
    then:
      - script.execute: check_internet
